    <div id="root">

          min-height: 100dvh;
          box-sizing: border-box;
          font-family:

            -apple-system,
            sans-serif;
        "
      >
        <header

            display: flex;

            justify-content: space-between;
            padding: 18px 0;
            border-bottom: 2px solid #e2e8f0;
          "

                width: 42px;
                height: 42px;
                border-radius: 12px;
                background: #e2e8f0;

              ></div>

              height: 36px;

          <div

              min-height: 124px;
              border-radius: 22px;
              background: #edf3ff;
              border: 2px solid #e2e8f0;
              border-bottom: 4px solid #cbd5e1;
              box-sizing: border-box;
              padding: 22px 24px;
              margin-bottom: 22px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 16px;
            "
          >
            <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; align-items: center; gap: 8px">

                <div style="width: 36px; height: 16px; border-radius: 6px; background: #bfdbfe"></div>

            </div>
            <div

                width: 105px;
                height: 90px;
                border-radius: 16px;
                background: #dbeafe;
                opacity: 0.5;
                flex-shrink: 0;
              "
            ></div>
          </div>

              style="
                flex: 1;
                height: 94px;
                border-radius: 18px;
                background: #ffffff;
                border: 2px solid #e2e8f0;
                border-bottom: 4px solid #cbd5e1;

            <div

                border-radius: 18px;
